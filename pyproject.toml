[project]
name = "chess-spy"
version = "0.0.1"
description = "A CLI tool that will pull a scouting report for a user of chess.com"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Ryan Sandridge", email = "noreply@ryansandridge.com"}]
license = { text = "GNU GENERAL PUBLIC LICENSE" }
dependencies = [
    "requests>=2.28.1",
    "rich>=12.6.0",
    "typer>=0.7.0",
    "chess>=1.9.4",
    "sqlalchemy>=1.4.46",
]

[project.scripts]
chess-spy = "chess_spy.cli:app"

[dependency-groups]
dev = [
    "black>=22.12.0",
    "pre-commit>=2.20.0",
    "pytest>=7.2.0",
    "flake8>=6.0.0",
]

[tool.uv]
# Install dev dependencies by default during `uv sync` / `uv run`
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chess-spy/chess_spy"]

[tool.flake8]
ignore = ["E203", "E501"]
max-line-length = 88
